<main id="landing-bg" class="landing">
  <section class="welcome-panel">
    <h1>Trattoria Bellavista</h1>
    <h2>Taste Italy, one bite at a time.</h2>
    <p>Wählen Sie Ihren Tisch und entdecken Sie unsere Speisekarte.</p>
    @if (tables.loading()) {
    <p role="status">Tische werden geladen …</p>
    } @if (tables.error()) {
    <p role="alert">{{ tables.error() }}</p>
    <button type="button" (click)="tables.getTables()">Erneut versuchen</button> }
    <label for="table">Ihr Tisch</label>
    <select
      id="table"
      [value]="tables.selectedTable()?.id ?? ''"
      (change)="selectTable($event)"
      [disabled]="tables.loading() || !!tables.error()"
    >
      <option value="">Bitte Tisch auswählen</option>
      @for (table of tables.tablesList(); track table.id) {
      <option [value]="table.id">Tisch {{ table.tableNumber }}</option>
      }
    </select>
    <button
      type="button"
      [disabled]="!tables.selectedTable() || tables.loading() || !!tables.error()"
      (click)="continue()"
    >
      Zur Speisekarte
    </button>
    <a routerLink="/speisekarte">Speisekarte ohne Tischauswahl ansehen</a>
  </section>
</main>
