<main id="landing-bg" class="landing">
  <section class="welcome-panel">
    <h1>Trattoria Bellavista</h1>
    <h2>Taste Italy, one bite at a time.</h2>
    <p>Entdecken Sie unsere Speisekarte und bestellen Sie direkt an Ihren Tisch.</p>
    @if (tables.loading()) {
    <p role="status">Tische werden geladen …</p>
    } @if (tables.error()) {
    <button type="button" (click)="tables.getTables()">Erneut versuchen</button>
    }
    <label id="table-label" for="table">Ihr Tisch</label>
    <p-select
      inputId="table"
      ariaLabel="Ihr Tisch"
      [options]="tableOptions()"
      optionLabel="label"
      optionValue="id"
      [ngModel]="selectedId()"
      (ngModelChange)="selectedId.set($event)"
      placeholder="Bitte Tisch auswählen"
      emptyMessage="Keine Tische verfügbar"
      [checkmark]="true"
      [loading]="tables.loading()"
      [disabled]="busy() || tables.loading() || !!tables.error()"
      appendTo="body"
      styleClass="table-select"
    />

    <button
      type="button"
      [disabled]="!selectedId() || busy() || tables.loading() || !!tables.error()"
      (click)="continue()"
    >
      {{ busy() ? 'Tisch wird geöffnet …' : 'Zur Speisekarte' }}
    </button>
    <button
      type="button"
      class="secondary"
      [disabled]="!selectedId() || busy() || tables.loading() || !!tables.error()"
      (click)="continue('/bestellungen')"
    >
      Meine Bestellungen ansehen
    </button>
    <a routerLink="/speisekarte">Speisekarte ohne Tischauswahl ansehen</a>
  </section>
</main>
