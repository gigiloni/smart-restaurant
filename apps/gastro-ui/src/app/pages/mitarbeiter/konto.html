<section>
  <div class="page-heading">
    <div>
      <span class="eyebrow">Ihr Mitarbeiterkonto</span>
      <h2>Mein Konto</h2>
      <p>{{ auth.employee()?.firstname }} {{ auth.employee()?.lastname }}</p>
    </div>
  </div>
  <form class="form-panel" (ngSubmit)="change()" #form="ngForm">
    <h3 class="panel-title">Passwort ändern</h3>
    <label for="current-password">Bisheriges Passwort</label>
    <div class="password-field">
      <input
        #currentpasswordInput
        id="current-password"
        name="current"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="current"
        required
        maxlength="128"
      />
      <app-password-toggle [field]="currentpasswordInput" />
    </div>
    <label for="new-password">Neues Passwort (mindestens 12 Zeichen)</label>
    <div class="password-field">
      <input
        #newpasswordInput
        id="new-password"
        name="next"
        type="password"
        autocomplete="new-password"
        [(ngModel)]="next"
        required
        minlength="12"
        maxlength="128"
      />
      <app-password-toggle [field]="newpasswordInput" />
    </div>
    <label for="confirm-password">Neues Passwort wiederholen</label>
    <div class="password-field">
      <input
        #confirmpasswordInput
        id="confirm-password"
        name="confirm"
        type="password"
        autocomplete="new-password"
        [(ngModel)]="confirm"
        required
      />
      <app-password-toggle [field]="confirmpasswordInput" />
    </div>

    <button type="submit" [disabled]="form.invalid || next !== confirm || busy()">
      Passwort speichern
    </button>
  </form>
</section>
