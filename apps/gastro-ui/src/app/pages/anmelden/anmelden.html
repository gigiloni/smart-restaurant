<main class="page auth-page">
  <section class="form-panel">
    <span class="eyebrow">Bellavista · Mitarbeiter</span>
    <h2>Willkommen zurück</h2>
    <p>Melden Sie sich mit Ihrem Mitarbeiterkonto an.</p>
    <form (ngSubmit)="submit()" #form="ngForm">
      <label for="email">E-Mail</label
      ><input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
        email
        maxlength="254"
      />
      <label for="password">Passwort</label>
      <div class="password-field">
        <input
          #passwordInput
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          maxlength="128"
          required
        />
        <app-password-toggle [field]="passwordInput" />
      </div>
      <label class="checkbox-label"
        ><input name="remember" type="checkbox" [(ngModel)]="remember" /> Angemeldet bleiben</label
      >

      <button type="submit" [disabled]="form.invalid || busy()">
        {{ busy() ? 'Anmeldung läuft …' : 'Anmelden' }}
      </button>
    </form>
    <a routerLink="/speisekarte">Zur Speisekarte</a>
  </section>
</main>
